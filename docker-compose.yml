services:
  lidarino_jazzy:
    build: .
    container_name: lidarino_robot
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    volumes:
      - /home/orangepi/lidarino_ws:/root/lidarino_ws
      - /dev:/dev
      # - /dev/bus/usb:/dev/bus/usb
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    command: tail -f /dev/null
