controller_manager:
  ros__parameters:
    update_rate: 1000  # Frequenza del loop di controllo (100 Hz)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lidar_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100

lidar_velocity_controller:
  ros__parameters:
    joints:
      - lidar_Revolute